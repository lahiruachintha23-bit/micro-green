<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Microgreen Tray Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <style>
        :root{
            --bg-start: #041f16;
            --bg-end: #072b20;
            --card-bg: rgba(7,56,46,0.95);
            --card-border: rgba(255,255,255,0.03);
            --text-main: #c8f7e6;
            --text-muted: #8fb7a6;
            --accent: #00e08a;
            --accent-2: #00cf7a;
            --danger: #ff6b6b;
            --glass: rgba(255,255,255,0.03);
            --shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
            min-height: 100vh;
            padding: 24px;
            color: var(--text-main);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: var(--accent);
            font-size: 2.2em;
            margin-bottom: 26px;
            text-align: left;
            font-weight: 800;
            letter-spacing: 0.4px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 22px;
            box-shadow: var(--shadow);
            border: 1px solid var(--card-border);
            transition: transform 0.24s ease, box-shadow 0.24s ease;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 18px 40px rgba(0,0,0,0.7);
        }

        .stat-label {
            font-size: 0.85em;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 2.2em;
            font-weight: 800;
            color: var(--text-main);
        }

        .stat-unit {
            font-size: 0.65em;
            color: var(--text-muted);
            margin-left: 6px;
        }

        .stage-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            margin-top: 10px;
            background: var(--glass);
            color: var(--text-main);
            border: 1px solid rgba(255,255,255,0.02);
        }

        .stage-germination { background: rgba(0,192,120,0.12); color: var(--accent); }
        .stage-growth { background: rgba(0,160,200,0.08); color: #8be4ff; }
        .stage-harvest { background: rgba(160,120,255,0.06); color: #d2b8ff; }
        .stage-unknown { background: rgba(255,255,255,0.02); color: var(--text-muted); }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        button {
            padding: 12px 16px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.12s ease, opacity 0.12s ease;
            font-size: 0.9em;
        }

        .btn-primary { background: linear-gradient(180deg,var(--accent),var(--accent-2)); color: #002612; }
        .btn-primary:hover { filter: brightness(0.95); }

        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { filter: brightness(0.95); }

        .btn-success { background: rgba(85,239,196,0.12); color: var(--accent); border: 1px solid rgba(0,224,138,0.12); }
        .btn-success:hover { transform: translateY(-2px); }

        .btn-default { background: rgba(255,255,255,0.03); color: var(--text-main); border: 1px solid rgba(255,255,255,0.02); }
        .btn-default:hover { transform: translateY(-2px); }

        .btn:disabled { opacity: 0.45; cursor: not-allowed; }

        .chart-container {
            position: relative;
            height: 300px;
            background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(0,0,0,0.05));
            border-radius: 12px;
            padding: 18px;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
        }

        .mode-toggle { display: flex; gap: 10px; margin-bottom: 15px; background: rgba(255,255,255,0.02); border-radius: 8px; padding: 6px; }

        .mode-btn { flex: 1; padding: 8px; border: none; background: transparent; cursor: pointer; font-weight: 700; border-radius: 6px; transition: all 0.18s; color: var(--text-main); }

        .mode-btn.active { background: rgba(255,255,255,0.02); box-shadow: 0 2px 8px rgba(0,0,0,0.6); }

        .status-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-top: 15px; }

        .status-item { background: transparent; padding: 12px; border-radius: 8px; text-align: center; border: 1px solid rgba(255,255,255,0.02); }

        .status-item label { display: block; font-size: 0.85em; color: var(--text-muted); margin-bottom: 5px; }

        .status-item span { display: block; font-size: 1.3em; font-weight: 800; color: var(--text-main); }
    </style>
</head>

<body>
    <div class="container">
        <h1>🌱 Smart Microgreen Tray</h1>

        <div class="grid">
            <div class="card">
                <div class="stat-label">Plant Height</div>
                <div class="stat-value"><span id="height">--</span><span class="stat-unit">cm</span></div>
                <div id="stageBadge" class="stage-badge stage-unknown">Unknown</div>
            </div>

            <div class="card">
                <div class="stat-label">Soil Moisture</div>
                <div class="stat-value"><span id="soilValue">--</span></div>
                <div class="status-grid" style="margin-top: 10px;">
                    <div class="status-item"><label>Threshold</label><span>2000</span></div>
                    <div class="status-item"><label>Status</label><span id="soilStatus">--</span></div>
                </div>
            </div>

            <div class="card">
                <div class="stat-label">Flow Rate</div>
                <div class="stat-value"><span id="flowValue">--</span><span class="stat-unit">ml/min</span></div>
                <div class="status-grid" style="margin-top: 10px;">
                    <div class="status-item"><label>Threshold</label><span>900</span></div>
                    <div class="status-item"><label>Safe</label><span id="flowStatus">--</span></div>
                </div>
            </div>
        </div>

        <div class="grid">
            <div class="card">
                <div class="stat-label">Pump Control</div>
                <div class="mode-toggle">
                    <button class="mode-btn active" onclick="setMode('Auto')">Auto</button>
                    <button class="mode-btn" onclick="setMode('ManualOn')">ON</button>
                    <button class="mode-btn" onclick="setMode('ManualOff')">OFF</button>
                </div>
                <div class="status-grid">
                    <div class="status-item"><label>Mode</label><span id="pumpMode">Auto</span></div>
                    <div class="status-item"><label>State</label><span id="pumpState">OFF</span></div>
                </div>
            </div>

            <div class="card">
                <div class="stat-label">Motor Control</div>
                <div class="controls">
                    <button class="btn-success" onclick="motorAction('on')">Motor ON</button>
                    <button class="btn-danger" onclick="motorAction('off')">Motor OFF</button>
                    <button class="btn-default" onclick="motorAction('reset')">Reset</button>
                </div>
                <div class="status-grid" style="margin-top: 15px;">
                    <div class="status-item"><label>Status</label><span id="motorStatus">OFF</span></div>
                </div>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="heightChart"></canvas>
        </div>

        <div class="chart-container">
            <canvas id="waterChart"></canvas>
        </div>
    </div>

    <script>
        let heightChart, waterChart;

        function updateStatus() {
            fetch('/status')
                .then(r => r.json())
                .then(data => {
                    document.getElementById('height').textContent = data.distance > 0 ? data.distance : '--';
                    document.getElementById('soilValue').textContent = data.soilValue;
                    document.getElementById('soilStatus').textContent = data.soilValue > 2000 ? 'Wet' : 'Dry';
                    document.getElementById('flowValue').textContent = parseFloat(data.flowValue).toFixed(1);
                    document.getElementById('flowStatus').textContent = data.flowValue > 900 ? '⚠️ High' : '✓ OK';
                    document.getElementById('pumpMode').textContent = data.pumpMode;
                    document.getElementById('pumpState').textContent = data.pumpState;
                    document.getElementById('motorStatus').textContent = data.motorStatus || 'OFF';

                    const stageClasses = ['stage-germination', 'stage-growth', 'stage-harvest', 'stage-unknown'];
                    const badge = document.getElementById('stageBadge');
                    stageClasses.forEach(c => badge.classList.remove(c));
                    badge.textContent = data.growthStage;
                    badge.classList.add('stage-' + data.growthStage.toLowerCase());

                    updateModeButtons(data.pumpMode);
                })
                .catch(e => console.error(e));
        }

        function setMode(mode) {
            fetch('/control?mode=' + mode).then(updateStatus).catch(e => console.error(e));
        }

        async function motorAction(action) {
            try {
                const response = await fetch('/.netlify/functions/motor-control', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action })
                });

                if (!response.ok) {
                    throw new Error('Netlify function error');
                }

                const result = await response.json();
                console.log('Motor command sent:', result);
                updateStatus();
            } catch (e) {
                console.warn('Falling back to local ESP32 motor endpoint:', e);
                fetch('/motor?action=' + action).then(updateStatus).catch(err => console.error(err));
            }
        }

        function updateModeButtons(mode) {
            document.querySelectorAll('.mode-btn').forEach((btn, idx) => {
                btn.classList.remove('active');
                const modes = ['Auto', 'ManualOn', 'ManualOff'];
                if (modes[idx] === mode) btn.classList.add('active');
            });
        }

        async function loadCharts() {
            try {
                const heightData = await fetch('/heightHistory').then(r => r.json());
                const waterData = await fetch('/waterEvents').then(r => r.json());

                const heightLabels = heightData.map(d => new Date(d.time * 1000).toLocaleTimeString());
                const heightValues = heightData.map(d => d.height);

                const heightCtx = document.getElementById('heightChart').getContext('2d');
                if (heightChart) heightChart.destroy();
                heightChart = new Chart(heightCtx, {
                    type: 'line',
                    data: {
                        labels: heightLabels,
                        datasets: [{
                            label: 'Plant Height (cm)',
                            data: heightValues,
                            borderColor: '#667eea',
                            backgroundColor: 'rgba(102, 126, 234, 0.1)',
                            tension: 0.4,
                            fill: true,
                            pointRadius: 3,
                            pointBackgroundColor: '#667eea'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: true, position: 'top' } },
                        scales: { y: { beginAtZero: true, title: { display: true, text: 'Height (cm)' } } }
                    }
                });

                const waterLabels = waterData.map(d => new Date(d.time * 1000).toLocaleTimeString());
                const waterValues = waterData.map((d, idx) => idx + 1);

                const waterCtx = document.getElementById('waterChart').getContext('2d');
                if (waterChart) waterChart.destroy();
                waterChart = new Chart(waterCtx, {
                    type: 'bar',
                    data: {
                        labels: waterLabels,
                        datasets: [{
                            label: 'Water Events',
                            data: waterValues,
                            backgroundColor: '#55efc4',
                            borderColor: '#00b894',
                            borderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: true, position: 'top' } },
                        scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
                    }
                });
            } catch (e) {
                console.error('Chart load error:', e);
            }
        }

        setInterval(updateStatus, 1000);
        setInterval(loadCharts, 5000);
        updateStatus();
        loadCharts();
    </script>
</body>

</html>
